spring:
  application:
    name: orgcheszer
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${COMPANY_EMAIL}
    password: ${COMPANY_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
otp:
  expiry:
    minutes: 10

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms
  cache:
    type: redis

application:
  security:
    jwt:
      secret-key: ${JWT_KEY}
      expiration: 86400000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    enabled: true
api:
  contact:
    email: beramanish.25@gmail.com
tournament:
  require-approval: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

admin:
  secret:
    key: ${ADMIN_SECRET_KEY}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}