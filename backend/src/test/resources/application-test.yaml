spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  # Point Redis to a dummy port so it doesn't try to connect to prod
  data:
    redis:
      host: localhost
      port: 9999
  # Tell Spring to use a simple HashMap in memory instead of Redis for caching
  cache:
    type: simple
application:
  security:
    jwt:
      #Dummy key for testing
      secret-key: 1111111111111111111111111111111111111111111111111111111111111111
      expiration: 360000
admin:
  secret:
    key: 111111 #dummy admin secret key